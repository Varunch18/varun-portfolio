<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script type="text/javascript">
    // Get the base URL from the current path
    var base_url = window.location.pathname.split('/').slice(0, -1).join('/') + '/';
    // Redirect the browser to the index.html file within that base path
    window.location.replace(base_url);
  </script>
</head>
<body>
  <p>Page not found. Redirecting...</p>
  <a href="/">Click here to go to the home page</a>
</body>
</html>
